<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rourke" />
<title>Coach Rourke — Phase 1</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #14161A;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #EDEEF0;
  }

  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  .header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid #24272E;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .eyebrow {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #8B93A1;
  }
  .phase-tag {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #C4622D;
    border: 1px solid #3A2E24;
    background: #1E1712;
    padding: 2px 8px;
    border-radius: 3px;
  }
  .title {
    font-family: -apple-system, sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.01em;
    margin: 0;
    color: #F5F6F7;
  }

  .storage-warning {
    margin-top: 10px;
    background: #241A12;
    border: 1px solid #4A3319;
    color: #E39A66;
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    padding: 9px 11px;
    line-height: 1.4;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 90px;
  }

  .tab-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .section-label {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #8B93A1;
    display: block;
    margin-bottom: 10px;
  }

  .date-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .date-chip {
    flex: 1;
    min-width: 40px;
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 8px;
    padding: 8px 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: #8B93A1;
    position: relative;
  }
  .date-chip-active {
    background: #24272E;
    border-color: #3D8B5F;
    color: #EDEEF0;
  }
  .date-chip-dow {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .date-chip-num {
    font-weight: 600;
    font-size: 16px;
  }
  .date-chip-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #C4622D;
    position: absolute;
    top: 6px;
    right: 6px;
  }

  .day-picker {
    display: flex;
    gap: 8px;
  }
  .day-pill {
    flex: 1;
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 8px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    color: #8B93A1;
  }
  .day-pill-active {
    background: #1A2420;
    border-color: #3D8B5F;
    color: #EDEEF0;
  }
  .day-pill-num {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
  }
  .day-pill-focus {
    font-size: 12px;
    font-weight: 600;
  }

  .workout-card {
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 10px;
    padding: 16px;
  }
  .workout-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .workout-label {
    font-weight: 700;
    font-size: 19px;
    color: #F5F6F7;
  }
  .progress-badge {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 13px;
    background: #14161A;
    border: 1px solid #2C303A;
    border-radius: 6px;
    padding: 4px 9px;
    color: #8B93A1;
    white-space: nowrap;
  }
  .progress-badge-done {
    border-color: #3D8B5F;
    color: #5FB582;
  }

  .exercise-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .exercise-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid #24272E;
  }
  .exercise-row:first-child { border-top: none; }
  .exercise-row-warmup {
    padding-bottom: 15px;
    border-bottom: 1px dashed #2C303A;
    margin-bottom: 4px;
  }
  .exercise-row-warmup .exercise-name {
    color: #8B93A1;
    font-weight: 600;
  }
  .exercise-row-warmup .exercise-target {
    color: #8B93A1;
  }
  .exercise-row-done .exercise-name {
    color: #6D7480;
    text-decoration: line-through;
    text-decoration-color: #3D3F46;
  }

  .checkbox {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 1.5px solid #3D4048;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: background 0.15s, border-color 0.15s;
    padding: 0;
  }
  .checkbox-checked {
    background: #5FB582;
    border-color: #5FB582;
  }

  .exercise-text { flex: 1; min-width: 0; }
  .exercise-name {
    font-size: 14.5px;
    font-weight: 600;
    color: #EDEEF0;
  }
  .exercise-meta {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-top: 2px;
  }
  .exercise-target {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #C4622D;
  }
  .exercise-note {
    font-size: 12px;
    color: #7D8493;
  }

  .weight-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .weight-input-wrap {
    display: flex;
    align-items: center;
    background: #14161A;
    border: 1px solid #2C303A;
    border-radius: 6px;
    padding: 0 4px 0 9px;
  }
  .weight-input-wrap.focused {
    border-color: #3D8B5F;
  }
  .weight-input {
    width: 48px;
    background: none;
    border: none;
    color: #EDEEF0;
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 6px 2px;
    text-align: right;
  }
  .weight-input::placeholder { color: #5C6270; }
  .weight-input:focus { outline: none; }
  .weight-unit {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #6D7480;
    padding-right: 4px;
  }
  .weight-last {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: #7D8493;
  }

  .effort-section {
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 10px;
    padding: 16px;
  }
  .effort-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .effort-readout {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #F5F6F7;
  }
  .dial {
    display: flex;
    gap: 4px;
  }
  .dial-tick {
    flex: 1;
    height: 30px;
    border-radius: 4px;
    border: 1px solid #2C303A;
    background: #14161A;
    padding: 0;
  }
  .dial-tick-filled {
    background: #3D8B5F;
    border-color: #3D8B5F;
  }
  .dial-tick-low {
    background: #C4622D;
    border-color: #C4622D;
  }
  .effort-rule {
    font-size: 12px;
    color: #7D8493;
    margin: 12px 0 0;
    line-height: 1.5;
  }

  .notes-section {
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 10px;
    padding: 16px;
  }
  .notes-input {
    width: 100%;
    background: #14161A;
    border: 1px solid #2C303A;
    border-radius: 7px;
    color: #EDEEF0;
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px;
    resize: vertical;
  }
  .notes-input:focus {
    outline: 2px solid #3D8B5F;
    outline-offset: 1px;
  }
  .notes-input::placeholder { color: #5C6270; }

  .editing-past-note {
    text-align: center;
    font-size: 12px;
    color: #C4622D;
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
  }

  .stat-block {
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 10px;
    padding: 18px 16px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .stat-value {
    font-weight: 700;
    font-size: 28px;
    color: #F5F6F7;
  }
  .stat-value-accent { color: #5FB582; }
  .stat-caption {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #7D8493;
  }
  .progress-track {
    height: 6px;
    background: #14161A;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #2C303A;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3D8B5F, #5FB582);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #7D8493;
    margin-top: 6px;
  }

  .entry-block {
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 10px;
    padding: 16px;
  }
  .entry-row {
    display: flex;
    gap: 8px;
  }
  .entry-date {
    flex: 1.3;
    background: #14161A;
    border: 1px solid #2C303A;
    border-radius: 7px;
    color: #EDEEF0;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 8px;
    min-width: 0;
  }
  .entry-weight {
    flex: 1;
    background: #14161A;
    border: 1px solid #2C303A;
    border-radius: 7px;
    color: #EDEEF0;
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 9px 8px;
    min-width: 0;
  }
  .entry-date:focus, .entry-weight:focus {
    outline: 2px solid #3D8B5F;
    outline-offset: 1px;
  }
  .entry-submit {
    background: #3D8B5F;
    color: #0F1410;
    font-weight: 700;
    font-size: 13px;
    border: none;
    border-radius: 7px;
    padding: 0 16px;
    white-space: nowrap;
  }
  .entry-hint {
    font-size: 12px;
    color: #7D8493;
    margin: 10px 0 0;
    line-height: 1.5;
  }

  .history-block {
    background: #1D2027;
    border: 1px solid #24272E;
    border-radius: 10px;
    padding: 16px;
  }
  .empty-state {
    font-size: 13px;
    color: #7D8493;
    padding: 8px 0;
    line-height: 1.5;
  }

  .weighin-list, .session-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .weighin-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid #24272E;
  }
  .weighin-row:first-child { border-top: none; }
  .weighin-date {
    flex: 1.4;
    font-size: 13px;
    color: #8B93A1;
  }
  .weighin-weight {
    flex: 1;
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 14px;
    color: #EDEEF0;
    font-weight: 600;
  }
  .weighin-delta {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #7D8493;
    min-width: 40px;
  }
  .weighin-delta-down { color: #5FB582; }
  .weighin-delta-up { color: #C4622D; }
  .weighin-delete {
    background: none;
    border: none;
    color: #5C6270;
    font-size: 18px;
    padding: 0 4px;
    line-height: 1;
  }

  .session-row {
    padding: 12px 0;
    border-top: 1px solid #24272E;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .session-row:first-child { border-top: none; }
  .session-row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .session-date {
    font-size: 13.5px;
    font-weight: 600;
    color: #EDEEF0;
  }
  .session-day-tag {
    font-size: 11.5px;
    color: #7D8493;
  }
  .session-row-bottom {
    display: flex;
    gap: 12px;
  }
  .session-completion {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: #8B93A1;
  }
  .session-effort {
    font-family: 'SF Mono', 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: #5FB582;
  }
  .session-effort-low { color: #C4622D; }
  .session-notes {
    font-size: 12.5px;
    color: #8B93A1;
    line-height: 1.5;
    margin-top: 2px;
    font-style: italic;
  }

  .alert-banner {
    background: #241A12;
    border: 1px solid #4A3319;
    color: #E39A66;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    padding: 11px 14px;
    line-height: 1.4;
  }

  .tabbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    background: #1A1C21;
    border-top: 1px solid #24272E;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar-btn {
    flex: 1;
    background: none;
    border: none;
    color: #6D7480;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 0;
    border-radius: 8px;
  }
  .tabbar-btn-active {
    color: #EDEEF0;
    background: #24272E;
  }

  button {
    cursor: pointer;
    font-family: inherit;
  }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid #3D8B5F;
    outline-offset: 2px;
  }

  @media (max-width: 360px) {
    .stat-value { font-size: 24px; }
    .title { font-size: 26px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // ---------- Static plan data (Coach Rourke's Phase 1) ----------

  var WORKOUTS = {
    1: {
      label: "Day 1",
      focus: "Lower Body",
      exercises: [
        { name: "Warm-Up", target: "5 min", note: "Easy bike or treadmill", isWarmup: true },
        { name: "Leg Press", target: "3 x 10-12", note: "Feet shoulder-width, don't lock knees at top" },
        { name: "Leg Extension", target: "3 x 10-12", note: "Control the negative" },
        { name: "Seated Leg Curl", target: "3 x 10-12", note: "Commonly skipped — don't skip it" },
        { name: "Hip Abductor/Adductor", target: "2 x 12-15", note: "Light weight, hip stability" },
        { name: "Calf Raise", target: "3 x 15", note: "Full stretch at bottom, pause at top" },
        { name: "Incline Treadmill Walk", target: "15 min", note: "3.0-3.5 mph, incline 4-6%" }
      ]
    },
    2: {
      label: "Day 2",
      focus: "Upper Body",
      exercises: [
        { name: "Warm-Up", target: "5 min", note: "Easy bike or treadmill", isWarmup: true },
        { name: "Chest Press Machine", target: "3 x 10-12", note: "Seat height at mid-chest" },
        { name: "Lat Pulldown", target: "3 x 10-12", note: "Pull to upper chest, no swinging" },
        { name: "Shoulder Press Machine", target: "3 x 10-12", note: "Press straight up, don't shrug" },
        { name: "Seated Row Machine", target: "3 x 10-12", note: "Squeeze shoulder blades at the end" },
        { name: "Assisted Dip / Tricep Pushdown", target: "2 x 12", note: "Whichever your Crunch has" },
        { name: "Bicep Curl Machine", target: "2 x 12", note: "Full range, no rushing" }
      ]
    },
    3: {
      label: "Day 3",
      focus: "Full Body + Cardio",
      exercises: [
        { name: "Warm-Up", target: "5 min", note: "Easy bike or treadmill", isWarmup: true },
        { name: "Leg Press", target: "3 x 10-12", note: "Lighter than Day 1 — maintenance volume" },
        { name: "Chest Press Machine", target: "2 x 10-12", note: "" },
        { name: "Lat Pulldown", target: "2 x 10-12", note: "" },
        { name: "Seated Row Machine", target: "2 x 10-12", note: "" },
        { name: "Seated Leg Curl", target: "2 x 12", note: "" },
        { name: "Incline Treadmill Walk", target: "20 min", note: "3.0-3.5 mph, incline 4-6% — longest session of the week" }
      ]
    }
  };

  var DAY_ORDER = [1, 2, 3];
  var STORAGE_KEY = "rourke-tracker-v1";
  var START_WEIGHT = 250;
  var GOAL_WEIGHT = 190;

  // ---------- Helpers (data / state — same rules as the artifact version) ----------

  // Local-timezone ISO date. Never use toISOString() for "what day is it" —
  // that's UTC, which is tomorrow's date every evening in US timezones.
  function toISODate(d) {
    function pad(n) { return n < 10 ? "0" + n : String(n); }
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function todayISO() {
    return toISODate(new Date());
  }

  // Some WebKit contexts restrict localStorage under file:// origins more
  // aggressively than a typical https:// page — this can range from silent
  // no-ops to throwing on property access. Rather than assume which
  // behavior applies, this probe actually attempts a real write+read+delete
  // once, up front, and the result gates every future storage call. If the
  // probe fails for any reason, the app runs entirely in memory for the
  // session instead of risking a crash on a later, less-defensive call.
  var storageAvailable = (function () {
    try {
      var testKey = "__rourke_storage_test__";
      window.localStorage.setItem(testKey, "1");
      var ok = window.localStorage.getItem(testKey) === "1";
      window.localStorage.removeItem(testKey);
      return ok;
    } catch (e) {
      return false;
    }
  })();

  function loadState() {
    if (!storageAvailable) {
      return { sessions: {}, weighIns: {}, weightDrafts: {} };
    }
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) throw new Error("empty");
      var parsed = JSON.parse(raw);
      var sessions = {};
      var srcSessions = parsed.sessions || {};
      for (var date in srcSessions) {
        if (Object.prototype.hasOwnProperty.call(srcSessions, date)) {
          sessions[date] = Object.assign({ weights: {} }, srcSessions[date]);
        }
      }
      return {
        sessions: sessions,
        weighIns: parsed.weighIns || {},
        weightDrafts: parsed.weightDrafts || {}
      };
    } catch (e) {
      return { sessions: {}, weighIns: {}, weightDrafts: {} };
    }
  }

  function saveState(state) {
    if (!storageAvailable) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // storage unavailable — app still works in-memory for this session
    }
  }

  function formatDateLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  function checkedCount(session) {
    if (!session || !session.checks) return 0;
    var n = 0;
    for (var k in session.checks) {
      if (session.checks[k]) n++;
    }
    return n;
  }

  function isSessionComplete(session, dayNumber) {
    var workout = WORKOUTS[dayNumber];
    if (!workout) return false;
    return workout.exercises.every(function (ex) {
      return !!session.checks[ex.name];
    });
  }

  // Finds the most recent weight logged for a specific exercise, searching
  // backward across ALL sessions (any day, any date) — not just today's day
  // number. This is what lets "Seated Leg Curl" on Day 3 show the weight you
  // used on Day 1, since it's the same machine even on a different day slot.
  //
  // excludeDate + excludeDayNumber together identify the ONE session
  // currently being viewed/edited, so that session's own live (possibly
  // uncommitted) value doesn't echo back as its own "last time." This is
  // narrower than excluding the whole date: if the person switches from
  // Day 1 to Day 3 without changing the calendar date (a same-day gym
  // session touching multiple day-slots), Day 1's just-logged weight must
  // still be visible to Day 3 — only Day 3's own in-progress entry for
  // *this date* should be excluded from its own lookup.
  //
  // Also checks weightDrafts: switching the day-pill resets checks for
  // that date (correct — one date can only represent one workout) but
  // carries any already-logged weights into weightDrafts rather than
  // deleting them. Those weights are tied to the EXERCISE, not the day
  // slot, so "last time" must still surface them even while they're
  // sitting in the draft holding area.
  function lastWeightFor(sessions, weightDrafts, exerciseName, excludeDate, excludeDayNumber) {
    var dates = Object.keys(sessions)
      .sort(function (a, b) { return a < b ? 1 : a > b ? -1 : 0; }); // newest first

    for (var i = 0; i < dates.length; i++) {
      var date = dates[i];
      var isExcludedSession = date === excludeDate && sessions[date].dayNumber === excludeDayNumber;
      if (isExcludedSession) continue;
      var w = sessions[date].weights && sessions[date].weights[exerciseName];
      if (w != null && w !== "") return { weight: w, date: date };
    }

    // Fall back to draft holding area (weights from a day-switch that
    // hasn't been re-committed by a fresh check yet). No exclusion needed
    // here: a draft only exists because its originating session was
    // already removed from state.sessions, so there's no "live session
    // being edited right now" to accidentally echo back — unlike the
    // sessions loop above, drafts are always something already past.
    var draftDates = Object.keys(weightDrafts || {})
      .sort(function (a, b) { return a < b ? 1 : a > b ? -1 : 0; });
    for (var j = 0; j < draftDates.length; j++) {
      var ddate = draftDates[j];
      var dw = weightDrafts[ddate] && weightDrafts[ddate][exerciseName];
      if (dw != null && dw !== "") return { weight: dw, date: ddate };
    }

    return null;
  }

  // Looks at the most recently touched day and only advances to the next day
  // in rotation once that day's exercises are ALL checked. An incomplete day
  // keeps being suggested across multiple app opens until it's finished.
  function nextDayNumber(sessions) {
    var entries = Object.keys(sessions)
      .filter(function (d) { return checkedCount(sessions[d]) > 0; })
      .sort(function (a, b) { return a < b ? 1 : a > b ? -1 : 0; })
      .map(function (d) { return [d, sessions[d]]; });

    if (entries.length === 0) return 1;

    var lastSession = entries[0][1];
    var lastDay = lastSession.dayNumber;

    if (!isSessionComplete(lastSession, lastDay)) {
      return lastDay;
    }
    return lastDay >= 3 ? 1 : lastDay + 1;
  }

  function computeLowStreak(sortedSessions) {
    var streak = 0;
    for (var i = 0; i < sortedSessions.length; i++) {
      var s = sortedSessions[i][1];
      if (s.effort != null && s.effort <= 6) {
        streak++;
      } else if (s.effort != null) {
        break;
      }
    }
    return streak;
  }

  // ---------- Tiny DOM helper ----------
  // el(tag, props, children) mirrors just enough of a React.createElement
  // shape to keep this file's structure close to the original component
  // logic, without pulling in a framework.
  function el(tag, props, children) {
    var node = document.createElement(tag);
    props = props || {};
    for (var key in props) {
      if (!Object.prototype.hasOwnProperty.call(props, key)) continue;
      var val = props[key];
      if (key === "className") {
        node.className = val;
      } else if (key === "style" && typeof val === "object") {
        Object.assign(node.style, val);
      } else if (key.indexOf("on") === 0 && typeof val === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), val);
      } else if (key === "text") {
        node.textContent = val;
      } else if (val === true) {
        node.setAttribute(key, "");
      } else if (val !== false && val != null) {
        node.setAttribute(key, val);
      }
    }
    children = children || [];
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c == null || c === false) continue;
      if (typeof c === "string" || typeof c === "number") {
        node.appendChild(document.createTextNode(String(c)));
      } else {
        node.appendChild(c);
      }
    }
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // ---------- App state ----------

  var state = loadState();
  var tab = "today";
  var selectedDate = todayISO();
  var viewDay = (state.sessions[selectedDate] || { dayNumber: nextDayNumber(state.sessions) }).dayNumber;

  // "Today" is captured once at script load, but as an iOS home-screen app
  // this page gets suspended and resumed for days without ever reloading —
  // so the calendar must be re-checked every time the app wakes (pageshow /
  // focus / visibilitychange) and once a minute for midnight rollovers
  // while it's open. If the user was sitting on the old "today", follow the
  // calendar forward; if they had deliberately selected a past date, keep
  // their selection and just re-render so the date strip shifts.
  var currentToday = todayISO();
  function checkDayRollover() {
    var now = todayISO();
    if (now === currentToday) return;
    if (selectedDate === currentToday) {
      selectedDate = now;
      viewDay = (state.sessions[now] || { dayNumber: nextDayNumber(state.sessions) }).dayNumber;
    }
    currentToday = now;
    render();
  }

  function persist() {
    saveState(state);
  }

  function getUpcomingDay() {
    return nextDayNumber(state.sessions);
  }

  // Mirrors the artifact's updateSession exactly: a session only persists
  // once at least one exercise is checked; weights survive a temporary
  // zero-check drop via weightDrafts rather than being lost.
  function updateSession(dateISO, patch) {
    var existing = state.sessions[dateISO] || {
      dayNumber: getUpcomingDay(),
      checks: {},
      weights: {},
      effort: null,
      notes: ""
    };
    var merged = Object.assign({}, existing, patch);

    if (checkedCount(merged) === 0) {
      var carryWeights = merged.weights || {};
      var hadSession = Object.prototype.hasOwnProperty.call(state.sessions, dateISO);
      if (!hadSession && Object.keys(carryWeights).length === 0) {
        return; // nothing to do
      }
      delete state.sessions[dateISO];
      var hasWeights = Object.keys(carryWeights).some(function (k) {
        return carryWeights[k] != null;
      });
      if (hasWeights) {
        state.weightDrafts[dateISO] = carryWeights;
      }
      persist();
      render();
      return;
    }

    var restoredWeights = Object.assign(
      {},
      state.weightDrafts[dateISO],
      merged.weights
    );
    var finalSession = Object.assign({}, merged, { weights: restoredWeights });
    delete state.weightDrafts[dateISO];
    state.sessions[dateISO] = finalSession;
    persist();
    render();
  }

  function recordWeighIn(dateISO, weight) {
    state.weighIns[dateISO] = weight;
    persist();
    render();
  }

  function deleteWeighIn(dateISO) {
    delete state.weighIns[dateISO];
    persist();
    render();
  }

  function setTab(t) {
    tab = t;
    render();
  }

  // ---------- Render: Header ----------

  function renderHeader() {
    return el("header", { className: "header" }, [
      el("div", { className: "header-top" }, [
        el("span", { className: "eyebrow", text: "COACH ROURKE" }),
        el("span", { className: "phase-tag", text: "PHASE 1" })
      ]),
      el("h1", { className: "title", text: "Weeks 1–4" })
    ]);
  }

  // ---------- Render: Today tab ----------

  function renderDateStrip() {
    var days = [];
    var today = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(today.getDate() - i);
      days.push(toISODate(d));
    }

    var chips = days.map(function (iso) {
      var d = new Date(iso + "T00:00:00");
      var active = iso === selectedDate;
      var isToday = iso === todayISO();
      var children = [
        el("span", { className: "date-chip-dow", text: d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2) }),
        el("span", { className: "date-chip-num", text: String(d.getDate()) })
      ];
      if (isToday) children.push(el("span", { className: "date-chip-dot" }));
      return el(
        "button",
        {
          className: "date-chip" + (active ? " date-chip-active" : ""),
          onClick: function () {
            selectedDate = iso;
            viewDay = (state.sessions[iso] || { dayNumber: getUpcomingDay() }).dayNumber;
            render();
          }
        },
        children
      );
    });

    return el("div", { className: "date-strip" }, chips);
  }

  function getCurrentSession() {
    var persisted = state.sessions[selectedDate];
    var draftWeights = state.weightDrafts[selectedDate] || {};
    if (persisted) {
      return Object.assign({}, persisted, {
        weights: Object.assign({}, draftWeights, persisted.weights)
      });
    }
    return {
      dayNumber: viewDay,
      checks: {},
      weights: draftWeights,
      effort: null,
      notes: ""
    };
  }

  function renderDayPicker(session) {
    var pills = DAY_ORDER.map(function (n) {
      return el(
        "button",
        {
          className: "day-pill" + (session.dayNumber === n ? " day-pill-active" : ""),
          onClick: function () {
            viewDay = n;
            updateSession(selectedDate, { dayNumber: n, checks: {} });
            render();
          }
        },
        [
          el("span", { className: "day-pill-num", text: "D" + n }),
          el("span", { className: "day-pill-focus", text: WORKOUTS[n].focus })
        ]
      );
    });
    return el("div", { className: "day-picker" }, pills);
  }

  var checkSvgPath = 'M2 8.5L6 12.5L14 3.5';

  function makeCheckIcon() {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("width", "12");
    svg.setAttribute("height", "12");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", checkSvgPath);
    path.setAttribute("stroke", "#0F1410");
    path.setAttribute("stroke-width", "2.2");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);
    return svg;
  }

  // Renders one exercise row. Weight input keeps its own live DOM value
  // (read directly from the input element) so typing a number and THEN
  // tapping the checkbox never loses what was typed — same guarantee the
  // React artifact's local "draft" state provided, just via the DOM node
  // itself here instead of component state.
  function renderExerciseRow(ex, session, allSessions) {
    var checked = !!session.checks[ex.name];
    var currentWeight = session.weights ? session.weights[ex.name] : undefined;
    var last = lastWeightFor(allSessions, state.weightDrafts, ex.name, selectedDate, session.dayNumber);
    var showWeightInput = !ex.isWarmup && !/treadmill|walk|bike|cardio/i.test(ex.name);

    function onToggle() {
      var checks = Object.assign({}, session.checks);
      checks[ex.name] = !checks[ex.name];
      updateSession(selectedDate, { dayNumber: session.dayNumber, checks: checks });
    }

    var checkboxChildren = checked ? [makeCheckIcon()] : [];
    var checkbox = el(
      "button",
      {
        className: "checkbox" + (checked ? " checkbox-checked" : ""),
        onClick: onToggle,
        "aria-label": checked ? "Mark " + ex.name + " as not done" : "Mark " + ex.name + " as done"
      },
      checkboxChildren
    );

    var metaChildren = [el("span", { className: "exercise-target", text: ex.target })];
    if (ex.note) metaChildren.push(el("span", { className: "exercise-note", text: ex.note }));

    var textChildren = [
      el("div", { className: "exercise-name", text: ex.name }),
      el("div", { className: "exercise-meta" }, metaChildren)
    ];

    if (showWeightInput) {
      var input = el("input", {
        type: "number",
        inputmode: "decimal",
        className: "weight-input",
        placeholder: "lb",
        value: currentWeight != null ? String(currentWeight) : "",
        "aria-label": "Weight for " + ex.name
      });

      var wrap = el("div", { className: "weight-input-wrap" }, [
        input,
        el("span", { className: "weight-unit", text: "lb" })
      ]);

      input.addEventListener("focus", function () {
        wrap.classList.add("focused");
      });

      function commit() {
        wrap.classList.remove("focused");
        var trimmed = input.value.trim();
        if (trimmed === "") {
          if (currentWeight != null) {
            var weights = Object.assign({}, session.weights);
            weights[ex.name] = null;
            updateSession(selectedDate, { dayNumber: session.dayNumber, weights: weights });
          }
          return;
        }
        var num = parseFloat(trimmed);
        if (!isNaN(num) && num >= 0 && num !== currentWeight) {
          var weights2 = Object.assign({}, session.weights);
          weights2[ex.name] = num;
          updateSession(selectedDate, { dayNumber: session.dayNumber, weights: weights2 });
        }
      }

      input.addEventListener("blur", commit);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          commit();
          input.blur();
        }
      });

      var weightRowChildren = [wrap];
      if (last) {
        weightRowChildren.push(el("span", { className: "weight-last", text: "last: " + last.weight + " lb" }));
      }
      textChildren.push(el("div", { className: "weight-row" }, weightRowChildren));
    }

    var rowClass = "exercise-row" +
      (checked ? " exercise-row-done" : "") +
      (ex.isWarmup ? " exercise-row-warmup" : "");

    return el("li", { className: rowClass }, [
      checkbox,
      el("div", { className: "exercise-text" }, textChildren)
    ]);
  }

  function renderEffortDial(session) {
    var ticks = [];
    for (var n = 1; n <= 10; n++) {
      (function (n) {
        var filled = session.effort != null && n <= session.effort;
        var isLowZone = n <= 6;
        var cls = "dial-tick" +
          (filled ? " dial-tick-filled" : "") +
          (filled && isLowZone ? " dial-tick-low" : "");
        ticks.push(el("button", {
          className: cls,
          "aria-label": "Set effort to " + n,
          onClick: function () {
            updateSession(selectedDate, { effort: n });
          }
        }));
      })(n);
    }
    return el("div", { className: "dial" }, ticks);
  }

  function renderToday() {
    var session = getCurrentSession();
    var workout = WORKOUTS[session.dayNumber];
    var isToday = selectedDate === todayISO();

    var totalExercises = workout.exercises.length;
    var doneCount = workout.exercises.filter(function (e) {
      return session.checks[e.name];
    }).length;
    var allDone = doneCount === totalExercises;

    var exerciseRows = workout.exercises.map(function (ex) {
      return renderExerciseRow(ex, session, state.sessions);
    });

    var workoutCard = el("section", { className: "workout-card" }, [
      el("div", { className: "workout-card-head" }, [
        el("div", {}, [
          el("div", { className: "workout-label", text: workout.label + " — " + workout.focus })
        ]),
        el("div", {
          className: "progress-badge" + (allDone ? " progress-badge-done" : ""),
          text: doneCount + "/" + totalExercises
        })
      ]),
      el("ul", { className: "exercise-list" }, exerciseRows)
    ]);

    var effortSection = el("section", { className: "effort-section" }, [
      el("div", { className: "effort-head" }, [
        el("span", { className: "section-label", text: "EFFORT" }),
        el("span", { className: "effort-readout", text: session.effort == null ? "Not rated" : session.effort + "/10" })
      ]),
      renderEffortDial(session),
      el("p", { className: "effort-rule", text: "Rourke's rule: three sessions at 6 or below → add weight next time." })
    ]);

    var notesTextarea = el("textarea", {
      className: "notes-input",
      placeholder: "How did it feel? Anything to remember for next time...",
      rows: 3
    });
    notesTextarea.value = session.notes || "";
    notesTextarea.addEventListener("blur", function () {
      if (notesTextarea.value !== (session.notes || "")) {
        updateSession(selectedDate, { notes: notesTextarea.value });
      }
    });

    var notesSection = el("section", { className: "notes-section" }, [
      el("span", { className: "section-label", text: "NOTES" }),
      notesTextarea
    ]);

    var children = [
      renderDateStrip(),
      renderDayPicker(session),
      workoutCard,
      effortSection,
      notesSection
    ];

    if (!isToday) {
      children.push(el("div", { className: "editing-past-note", text: "Editing " + formatDateLabel(selectedDate) }));
    }

    return el("div", { className: "tab-panel" }, children);
  }

  // ---------- Render: Weight tab ----------

  function renderWeighInLog() {
    var sorted = Object.keys(state.weighIns)
      .sort(function (a, b) { return a < b ? 1 : a > b ? -1 : 0; })
      .map(function (d) { return [d, state.weighIns[d]]; });

    var latest = sorted.length ? sorted[0][1] : null;
    var totalLost = latest != null ? (START_WEIGHT - latest).toFixed(1) : "0.0";
    var remaining = latest != null
      ? Math.max(latest - GOAL_WEIGHT, 0).toFixed(1)
      : (START_WEIGHT - GOAL_WEIGHT).toFixed(1);
    var progressPct = latest != null
      ? Math.min(100, Math.max(0, ((START_WEIGHT - latest) / (START_WEIGHT - GOAL_WEIGHT)) * 100))
      : 0;

    var statBlock = el("section", { className: "stat-block" }, [
      el("div", { className: "stat-row" }, [
        el("div", { className: "stat" }, [
          el("span", { className: "stat-value", text: latest != null ? String(latest) : "—" }),
          el("span", { className: "stat-caption", text: "CURRENT LB" })
        ]),
        el("div", { className: "stat" }, [
          el("span", { className: "stat-value stat-value-accent", text: totalLost }),
          el("span", { className: "stat-caption", text: "LOST" })
        ]),
        el("div", { className: "stat" }, [
          el("span", { className: "stat-value", text: remaining }),
          el("span", { className: "stat-caption", text: "TO GOAL" })
        ])
      ]),
      el("div", { className: "progress-track" }, [
        el("div", { className: "progress-fill", style: { width: progressPct + "%" } })
      ]),
      el("div", { className: "progress-labels" }, [
        el("span", { text: START_WEIGHT + " lb" }),

      ])
    ]);

    var dateInput = el("input", { type: "date", className: "entry-date" });
    dateInput.value = todayISO();
    dateInput.max = todayISO();

    var weightInput = el("input", {
      type: "number",

    var entryBlock = el("section", { className: "entry-block" }, [
      el("span", { className: "section-label", text: "LOG A WEIGH-IN" }),

        weightInput,
        el("button", { className: "entry-submit", text: "Log", onClick: submit })
      ]),

    ]);

    var historyChildren;
    if (sorted.length === 0) {

    } else {
      var rows = sorted.map(function (entry, idx) {
        var iso = entry[0], w = entry[1];

          deltaText = parseFloat(delta) > 0 ? "+" + delta : delta;
        }
        return el("li", { className: "weighin-row" }, [
          el("span", { className: "weighin-date", text: formatDateLabel(iso) }),
          el("span", { className: "weighin-weight", text: w + " lb" }),
          el("span", { className: deltaClass, text: deltaText }),
          el("button", {
            className: "weighin-delete",
            "aria-label": "Delete entry",
            text: "×",
            onClick: function () { deleteWeighIn(iso); }
          })
        ]);
      });
      historyChildren = [el("ul", { className: "weighin-list" }, rows)];
    }

    var historyBlock = el("section", { className: "history-block" }, [
      el("span", { className: "section-label", text: "HISTORY" })
    ].concat(historyChildren));

    return el("div", { className: "tab-panel" }, [statBlock, entryBlock, historyBlock]);
  }

  // ---------- Render: History tab ----------

  function renderHistory() {
    var sorted = Object.keys(state.sessions)
      .filter(function (d) { return checkedCount(state.sessions[d]) > 0; })
      .sort(function (a, b) { return a < b ? 1 : -1; })
      .map(function (d) { return [d, state.sessions[d]]; });

    var last7 = sorted.slice(0, 7);
    var ratedEfforts = last7.map(function (s) { return s[1].effort; }).filter(function (e) { return e != null; });
    var lowStreak = computeLowStreak(sorted);

    }

    var avgEffort = ratedEfforts.length
      ? (ratedEfforts.reduce(function (a, b) { return a + b; }, 0) / ratedEfforts.length).toFixed(1)
      : "—";

    children.push(el("section", { className: "stat-block" }, [
      el("div", { className: "stat-row" }, [
        el("div", { className: "stat" }, [

          el("span", { className: "stat-caption", text: "SESSIONS LOGGED" })
        ]),

          el("span", { className: "stat-caption", text: "AVG EFFORT (7)" })

        var workout = WORKOUTS[s.dayNumber];

        if (s.effort != null) {

          el("div", { className: "session-row-top" }, [

          ]),
          el("div", { className: "session-row-bottom" }, bottomChildren)
        ];
        if (s.notes) {

        }

        return el("li", { className: "session-row" }, rowChildren);
      });
      sessionChildren = [el("ul", { className: "session-list" }, rows)];
    }

    children.push(el("section", { className: "history-block" }, [
      el("span", { className: "section-label", text: "SESSION LOG" })
    ].concat(sessionChildren)));

    return el("div", { className: "tab-panel" }, children);
  }

  // ---------- Render: Tab bar ----------

  function renderTabBar() {
    var tabs = [
      { id: "today", label: "Today" },
      { id: "log", label: "Weight" },
      { id: "history", label: "History" }
    ];
    var buttons = tabs.map(function (t) {
      return el("button", {
        className: "tabbar-btn" + (tab === t.id ? " tabbar-btn-active" : ""),
        text: t.label,
        onClick: function () { setTab(t.id); }
      });
    });
    return el("nav", { className: "tabbar" }, buttons);
  }

  // ---------- Root render ----------

  function render() {
    var root = document.getElementById("app");
    var prevContent = document.querySelector(".content");
    var scrollTop = prevContent ? prevContent.scrollTop : 0;

    clear(root);

    var headerEl = renderHeader();
    if (!storageAvailable) {
      headerEl.appendChild(el("div", {
        className: "storage-warning",
        text: "⚠ Storage unavailable in this view — nothing you log will be saved. Add to Home Screen and reopen from there."
      }));
    }

    var content = el("main", { className: "content" }, [
      tab === "today" ? renderToday() : null,
      tab === "log" ? renderWeighInLog() : null,
      tab === "history" ? renderHistory() : null
    ]);

    root.appendChild(headerEl);
    root.appendChild(content);
    root.appendChild(renderTabBar());

    content.scrollTop = scrollTop;
  }

  window.addEventListener("pageshow", checkDayRollover);
  window.addEventListener("focus", checkDayRollover);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) checkDayRollover();
  });
  setInterval(checkDayRollover, 60 * 1000);

  render();
})();
</script>
</body>
</html>
